<!DOCTYPE html>
<html>
<head>
  <title>Bookmark Sets</title>
  <style>
    body {
      width: 300px;
      font-family: Arial, sans-serif;
      padding: 10px;
    }
    .folder {
      cursor: pointer;
      padding: 8px;
      margin: 4px 0;
      background-color: #f0f0f0;
      border-radius: 4px;
      transition: background-color 0.2s;
      position: relative;
    }
    .folder:hover {
      background-color: #e0e0e0;
    }
    .folder.active {
      background-color: #FFE0B2;
      border-left: 4px solid #FF9800;
      padding-left: 4px;
    }
    #status {
      margin-top: 10px;
      color: #4CAF50;
      font-weight: bold;
      min-height: 20px;
    }
    .error {
      color: #F44336;
    }
    h3 {
      margin-top: 0;
    }
    .note {
      font-size: 12px;
      color: #666;
      margin-top: 15px;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <h3>Bookmark Sets</h3>
  <div id="folders"></div>
  <div id="status"></div>
  <div class="note">
    Click on a folder to set it as your active bookmark bar.<br>
    Any changes you make to your bookmark bar will be saved back to the original folder when you switch.<br>
    <small>Configuration and tracking data is stored in your "Other Bookmarks" folder.</small>
  </div>
  <script src="popup.js"></script>
</body>
</html>
